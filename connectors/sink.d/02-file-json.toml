[[connectors]]
id = "file_json_sink"
type = "file"
# max_size / max_rolls / roll_compress 只列举在 allow_override，不要写进 params 给默认值：
# merge_params 要求覆盖值类型与默认值一致，默认成整数 0 会让 max_size = "10MB" 被拒绝。
allow_override = ["base","file","sync","compression","encryption","max_size","max_rolls","roll_compress"]
[connectors.params]
fmt  = "json"
base = "./data/out_dat"
file = "default.json"
