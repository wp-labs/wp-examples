version = "2.0"

[sink_group]
name = "nginx"
rule = ["*"]
batch_timeout_ms=3000
parallel = 1


# # Null sink 用于性能基准测试
# [[sink_group.sinks]]
# name = "blackhole"
# connect = "blackhole_sink"

[[sink_group.sinks]]
name = "doris_stream_load"
connect = "doris_sink"
[sink_group.sinks.params]
# 新版 Doris Sink 使用 HTTP Stream Load API
endpoint = "http://localhost:8040"  # BE 的 HTTP 端口（推荐使用 8040 而非 FE 的 8030）
user = "root"
password = ""
database="test_db"
table = "wp_nginx"
batch_size = 300_000

