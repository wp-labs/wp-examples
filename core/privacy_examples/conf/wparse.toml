version = "1.0"
# 脱敏密钥不在本文件配置：固定从 .warp_parse/sec_key.toml 读取 sec_pii_salt / sec_pii_key
# （无需 [privacy] 段；OML 也不写 salt: / key:）
robust = "normal"

[models]
wpl = "./models/wpl"
oml = "./models/oml"

[topology]
sources = "./topology/sources"
sinks = "./topology/sinks"

[performance]
parse_workers = 2
rate_limit_rps = 500000

[rescue]
path = "./data/rescue"

[log_conf]
level = "warn,ctrl=info,launch=info"
output = "File"
[log_conf.file]
path = "./data/logs/"

[stat]
window_sec = 60

[[stat.pick]]
key = "pick_stat"
target = "*"
fields = []
top_n = 20

[[stat.parse]]
key = "parse_stat"
target = "*"
fields = []
top_n = 20

[[stat.sink]]
key = "sink_stat1"
target = "*"
fields = []
top_n = 5

[[stat.sink]]
key = "sink_stat2"
target = "example/simple_file_sink"
fields = ["access_ip"]
top_n = 2
