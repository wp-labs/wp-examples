version = "2.0"

[sink_group]
name = "demo"
oml = ["/oml/good_json"]
tags = ["biz:demo"]
batch_size = 10
batch_timeout_ms = 300

[[sink_group.sinks]]
name = "json"
connect = "file_json_sink"
tags = ["sink:json"]

[sink_group.sinks.params]
file = "good.json"

[sink_group.sinks.expect]
ratio = 0.50
tol   = 0.02
