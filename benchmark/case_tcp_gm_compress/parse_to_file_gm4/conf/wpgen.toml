version = "1.0"

[generator]
count = 1000
speed = 0
parallel = 4

[output]
# 仅当存在 connect 时，其他 output 字段和旧式 [output.*] 子块将被忽略
name = "gen_out"
# 覆写允许的参数（参考 connectors/sink.d 中对应连接器 allow_override）
connect = "tcp_sink"

[output.params]
port = 19001

# 压缩：先 zstd 压缩（日志文本甜点位 level 3）
[output.params.compression]
enabled = true
algo = "zstd"
level = 3

# 加密：国密 SM4-GCM（16 字节密钥，hex 32 字符）
[output.params.encryption]
enabled = true
algo = "sm4-gcm"
key = "000102030405060708090a0b0c0d0e0f"

[logging]
level = "info,ctrl=info"
output = "file"
file_path = "./data/logs/"
