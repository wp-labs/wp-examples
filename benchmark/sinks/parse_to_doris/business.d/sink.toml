version = "2.0"

[sink_group]
name = "all"
#parallel = 5
parallel = 6
rule= ["*"]
#tags = ["group:benchmark", "type:business"]

# Null sink 用于性能基准测试
# [[sink_group.sinks]]
# name = "blackhole"
# connect = "blackhole_sink"
#tags = ["sink:null", "purpose:benchmark"]

# 可选：启用文件输出进行调试
# [[sink_group.sinks]]
# name = "debug_output"
# connect = "file_json_sink"
# params = { base = "./out", file = "benchmark_debug.json" }



[[sink_group.sinks]]
name = "doris_stream_load"
connect = "doris_sink"
[sink_group.sinks.params]
endpoint = "http://localhost:8040"  # BE 的 HTTP 端口（推荐使用 8040 而非 FE 的 8030）
database = "test_db"
table = "wp_nginx"
user = "root"
password = ""
timeout_secs = 30
max_retries = 1
batch_size = 40_0000

# 可选：自定义 Stream Load 参数
[sink_group.sinks.params.headers]
strip_outer_array = "false"
max_filter_ratio = "0.1"
columns="wp_event_id,wp_src_key,sip,timestamp,`http/request`,size,referer,`http/agent`"
