version = "1.0"

[models]
wpl = "../models/wpl"
oml = "../models/oml"

[topology]
sources = "../sources"
sinks = "../sinks/parse_to_blackhole"

[performance]
parse_workers = 2
rate_limit_rps = ${RATE_LIMIT_RPS:0}

[rescue]
path = "./data/rescue"

[log_conf]
level = "warn,ctrl=info"
output = "File"
[log_conf.file]
path = "./data/logs"
