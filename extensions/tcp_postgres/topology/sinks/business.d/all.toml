version = "2.0"

[sink_group]
name = "all"
oml = ["/*"]
parallel = 8
[[sink_group.sinks]]
name = "main"
connect = "postgres_sink"
[sink_group.sinks.params]
endpoint = "localhost:5432"
username = "postgres"
password = "123456"
database = "wparse"
table = "nginx_logs"
columns = ["sip", "timestamp", "http/request", "status", "size", "referer", "http/agent"]
batch_size = 10
