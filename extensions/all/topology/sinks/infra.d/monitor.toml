version = "2.0"

[sink_group]
name = "monitor"
batch_size = 1
batch_timeout_ms = 300

[[sink_group.sinks]]
connect = "file_proto_sink"

[sink_group.sinks.params]
file = "monitor.dat"
sync = true

[sink_group.sinks.expect]
max = 1.0

[[sink_group.sinks]]
connect = "prometheus_sink"
name = "prometheus"

[sink_group.sinks.params]
endpoint = "127.0.0.1:35666"
source_key_format = "(?P<source_type>.)_(?P<access_source>.)"
sink_key_format = "(?P<rule>.)_(?P<sink_type>.)_sink"

[[sink_group.sinks]]
name = "victoriametrics"
connect = "victoriametrics_sink"