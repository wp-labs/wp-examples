version = "2.0"

[sink_group]
name = "all"
rule = ["/*"]

[[sink_group.sinks]]
name = "main"
connect = "postgres_sink"
[sink_group.sinks.params]
endpoint = "localhost:5432"
username = "postgres"
password = "123456"
database = "wparse"
table = "http_request_logs_copy"
columns = ["sip", "timestamp", "http/request", "status", "create_time", "id", "update_time"]
batch_size = 10

