version = "2.0"

[sink_group]
name = "ck"
rule = ["*"]
batch_timeout_ms=5000
parallel = 4

[[sink_group.sinks]]
name = "ck_stream_load"
connect = "clickhouse_sink"
[sink_group.sinks.params]
endpoint= "http://localhost:8123"
username = "${SEC_SINK_USERNAME}"
password = "${SEC_SINK_PASSWORD}"
database = "default"
table = "wp_nginx"
timeout_secs = 30
max_retries = 3
batch_size = 100_0000
