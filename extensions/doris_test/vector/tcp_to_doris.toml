[sources.tcp_source_1]
type = "socket"
address = "127.0.0.1:19001"
mode = "tcp"
max_length = 10485760

[transforms.parser]
type = "remap"
inputs = ["tcp_source_1"]
source = '''
. |= parse_regex!(.message, r'^(?P<sip>\S+) \S+ \S+ \[(?P<timestamp>[^\]]+)\] "(?P<http_request>[^"]*)" (?P<status>\d{3}) (?P<size>\d+) "(?P<referer>[^"]*)" "(?P<http_agent>[^"]*)"')
del(.message)

.status = to_int!(.status)   
.size   = to_int!(.size)

if .host == "127.0.0.1" {
  .match_chars = "localhost"
} else {
  .match_chars = "attack_ip"
}

if .status == 500 {
  .str_status = "Internal Server Error"
} else if .status == 404 {
  .str_status = "Not Found"
}

.ingest_ts = now()
'''


[sinks.doris_stream_load]
type = "http"
inputs = ["parser"]

uri = "http://127.0.0.1:8040/api/logs/nginx_access/_stream_load"
method = "put"

encoding.codec = "json"

batch.max_bytes = 10485760
batch.timeout_secs = 1

request.concurrency = 4
request.timeout_secs = 60

request.headers.Authorization = "Basic YWRtaW46"
request.headers.format = "json"
request.headers.read_json_by_line = "false"
request.headers.Content-Type = "application/json"
request.headers.Expect = "100-continue"
request.headers.strip_outer_array = "true"
request.headers.strict_mode = "false"

request.headers.columns = "sip,timestamp,status,size,referer,str_status"

[api]
enabled = true