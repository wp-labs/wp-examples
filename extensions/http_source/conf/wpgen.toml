version = ""

[generator]
mode = "sample"
count = 100
speed = 20
parallel = 1


[output]
# 仅当存在 connect 时，其他 output 字段和旧式 [output.*] 子块将被忽略
name = "gen_out"
connect = "http_sink"
params = { endpoint= "http://localhost:8000/insert", fmt = "ndjson", compression = "none", timeout_secs = 30, max_retries = 3, batch_size = 10 }

[logging]
level = ""
module_levels = []
output = ""
file_path = "./data/logs"

[presets]
