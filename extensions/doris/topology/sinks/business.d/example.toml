version = "2.0"

[sink_group]
name = "doris"
oml = ["example2"]

[[sink_group.sinks]]
name = "file_proto_sink"
connect = "file_proto_sink"
[sink_group.sinks.params]
file = "events.parsed.prototext"
[sink_group.sinks.expect]
ratio = 0.50
tol   = 0.01

[[sink_group.sinks]]
name = "doris_stream_load"
connect = "doris_sink"
[sink_group.sinks.params]
# 新版 Doris Sink 使用 HTTP Stream Load API
endpoint = "http://localhost:8040"  # BE 的 HTTP 端口（推荐使用 8040 而非 FE 的 8030）
database = "wp_test"
table = "events_parsed"
user = "root"
password = ""
timeout_secs = 30
max_retries = 1
batch_size = 1000_000

# 可选：自定义 Stream Load 参数
[sink_group.sinks.params.headers]
strip_outer_array = "false"
max_filter_ratio = "0.1"

# 注意：新版不再支持以下参数
# - create_table: 请手动在 Doris 中创建表
# - pool_size: HTTP 客户端自动管理连接
# - mapping: 字段映射由模型层处理
